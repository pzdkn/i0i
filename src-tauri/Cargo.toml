[package]
name = "i0i"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "i0i_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# On by default (RFC 0054): the local ONNX embedding reranker. Pulls the native
# ONNX Runtime via fastembed and downloads a ~130 MB model on first run. Build
# with `--no-default-features` to drop it; ranking then uses legacy weights.
default = ["embeddings"]
embeddings = ["dep:fastembed"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
reqwest = { version = "0.13.3", features = ["json", "stream"] }
url = "2"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
quick-xml = "0.36"
futures-util = "0.3"
pdfium-render = { version = "0.9.2", default-features = false, features = ["pdfium_latest", "thread_safe"] }
async-trait = "0.1.89"
tauri-plugin-dialog = "2"
regex = "1"
fastembed = { version = "4", optional = true }
ammonia = "4.1.4"
scraper = "0.27.0"
dom_smoothie = "0.18.0"
base64 = "0.23.0"
# 0.1.10-alpha.4 ships a broken package (missing sqlite-vec-diskann.c); pin exact.
sqlite-vec = "=0.1.9"
tokio-tungstenite = { version = "0.28", features = ["connect"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
schemars = { version = "1", features = ["derive"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
jsonschema = { version = "0.55.1", default-features = false }
rmcp = { version = "3.2.0", features = ["client", "transport-streamable-http-client-reqwest"] }
